name: ci

# Every PR and main: lint; build THE rpm once in AlmaLinux 8; install that same
# rpm on EL8, EL9 and EL10 and run the smoke test and CFM's REAL edge config
# and Lua on it (tests/cfm-conf.sh). The rpm is kept as an artifact.
#
# The cfm-conf job reads chrismfz/cfm. If that repo is private, add a
# fine-grained read-only token as the CFM_READ_TOKEN secret; without it the
# checkout FAILS (on purpose: a contract test that cannot run must not pass).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck >/dev/null
      - run: make lint

  # ONE rpm, built on EL8 (glibc 2.28 floor), shipped to every EL.
  build:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: fetch + verify sources
        run: sudo apt-get install -y -qq gpgv >/dev/null && make sources
      - name: build in AlmaLinux 8
        run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: cfm-edge-rpm
          path: dist/el8/*.rpm
          retention-days: 14

  # ...and that SAME rpm installed and tested on each EL.
  test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        el: ["8", "9", "10"]
    name: test on el${{ matrix.el }}
    env:
      IMAGE: quay.io/almalinuxorg/almalinux:${{ matrix.el }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: chrismfz/cfm
          path: cfm
          token: ${{ secrets.CFM_READ_TOKEN || github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: cfm-edge-rpm
          path: dist/el8
      - name: smoke
        run: tools/container-build.sh 8 smoke
      - name: cfm-conf (CFM's real edge config + Lua)
        run: CFM_DIR="$GITHUB_WORKSPACE/cfm" EDGE_NOFILE=1048576 tools/container-build.sh 8 cfm-conf
