# /etc/cfm-edge/nginx.conf: the package's placeholder.
#
# It listens on loopback only, on a port no edge uses, so installing the
# package (or starting it by mistake) can never take :80/:443 from the live
# edge. CFM's install script replaces this file with the real edge config.
#
#   curl -s http://127.0.0.1:9099/    -> proves nginx + LuaJIT + resty.core load

user nobody;
worker_processes 1;

events {
    worker_connections 256;
}

http {
    include      mime.types;
    default_type application/octet-stream;
    server_tokens off;

    server {
        listen 127.0.0.1:9099;
        location / {
            default_type text/plain;
            content_by_lua_block {
                local cjson = require "cjson.safe"
                ngx.say(cjson.encode({
                    edge  = "cfm-edge",
                    nginx = ngx.config.nginx_version,
                    ngx_lua = ngx.config.ngx_lua_version,
                    jit   = jit and jit.version or nil,
                }))
            }
        }
    }
}
